<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel.js</title>
    <link  rel="stylesheet" href="estilo.css"> 
    <style>
        body {
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }



        *, *::before, *::after{
            box-sizing: border-box;
            
        }

        table{
            border-collapse: collapse;
        }

        thead,
        tr td:first-child {
            background: #ddf1fd;
        }

        th, td {
            border: 1px solid #ccc;
            font-weight: normal;;
            font-size: 12px;
            text-align: center;
            width: 65px;
            height: 20px;
            vertical-align: middle;
            position:relative

        }
        
        span, 
        input {
            position:absolute;
            inset: 0;
            vertical-align: middle;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            
        }
        input {
            border: 0;
            opacity: 0; 
            pointer-events: none;
            width: 100%;
            border-radius: 2px;

            &:focus{
                opacity: 1;
                outline: 2px solid rgb(72, 179, 251);

            }
           

        }

    </style>





    <script type = "module">
    const $ = el => document.querySelector(el)
    const $$ = el => document.querySelectorAll(el)

    const $table = $('table')
    const $head = $('thead')
    const $body = $('tbody')

    const COLUMNAS = 10
    const FILAS = 15
    const FIRST_CHAR_CODE=65

    
    const range = length => Array.from({length } , (_, i) => i)
    const obtenerColumna= i => String.fromCharCode(FIRST_CHAR_CODE + i)
    
    let STATE = range(COLUMNAS)
    .map(i=> range(FILAS).map(j=>({ computedValue: 0, value: 0 })))
    
    console.log(STATE)

    function updateCell({ x, y, value }){
        const newState= structuredClone(STATE)

        const constants= generateCellsContants(newState)

        const cell = newState[x][y]

        cell.computedValue = computeValue(value, constants)      
        cell.value = value

        newState[x][y] = cell

        computeAllCells(newState,generateCellsContants(newState))

        STATE = newState

        renderSpreadSheet()
    }

    function generateCellsContants (cells){
        return cells.map((filas, x)=>{
            return filas.map((cell, y)=>{
                const letra = obtenerColumna(x)
                const cellId= `${letra}${y + 1}`
                return `const ${cellId} = ${cell.computedValue};`

            }).join('\n')
        }).join('\n')
    }

    function computeAllCells(cells, constants){
        cells.forEach((filas, x)=>{
            filas.forEach((cell, y) =>{
                const computedValue=computeValue(cell.value, constants)
                cell.computedValue= computedValue
            })
        })
    }

    function computeValue(value, constants){
        if (typeof value === 'number')return value
        if (!value.startsWith('='))return value

        const formula=value.slice(1)

        let computedValue
        try {
            computedValue=eval(`(( )=> {
            ${constants}
            return ${formula};

            })()`)

        }catch(e){
            computedValue = '!ERROR:  ${e.message}'


        }
        return computedValue
    }
    
    const renderSpreadSheet = () => {
        const headerHTML = `<tr>
                <th></th>
                ${range(COLUMNAS).map(i => `<th>${obtenerColumna(i)}</th>`).join('')}
            </tr>`

        $head.innerHTML = headerHTML    

        const bodyHTML = range (FILAS).map(fila =>{
            return `<tr>
            <td>${fila + 1 }</td>
            ${range(COLUMNAS).map(columna => `
            <td data-x="${columna}" data-y="${fila}">
                <span>${STATE[columna][fila].computedValue}</span>
                <input type= "text" value="${STATE[columna][fila].value}"/>
            </td>    
            `).join('')}
   
        </tr>`
        }).join('')


        $body.innerHTML = bodyHTML
    }



    $body.addEventListener('click', event=> {
    const td= event.target.closest ('td')
    if (!td) return

    const { x, y } = td.dataset
    const input= td.querySelector('input')
    const span= td.querySelector('span')

    const end= input.value.length
    input.setSelectionRange(end, end)
    input.focus()

    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter')input.blur()
    })

    input.addEventListener('blur', () => {
        console.log({ value: input.value, state: STATE[x][y].value })
    
        if (input.value === STATE [x][y].value) return

    updateCell({ x, y, value: input.value })
    }, { once: true })
    })
    
    renderSpreadSheet()
    </script>


</head>

<body>

    <h1>Hoja de Cálculo</h1>

    <table style="margin: 0 auto; width: 90%;">
        <thead></thead>

        <tbody></tbody>
    </table>
    
</body>
</html>
