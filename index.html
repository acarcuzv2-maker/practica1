<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel.js</title>
    <link  rel="diseñosheet" href="diseño.css"> 
    <style>
        body {
            font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif
        }



        *, *::before, *::after{
            box-sizing: border-box;
            
        }

        table{
            border-collapse: collapse;
        }

        thead,
        tr td:first-child {
            background: #ddf1fd;
        }

        th, td {
            border: 1px solid #ccc;
            font-weight: normal;;
            font-size: 12px;
            text-align: center;
            width: 64px;
            height: 20px;
            vertical-align: middle;

        }

        input {
            border: 0;
            opacity: 0; 
            pointer-events: none;
            width: 100%;

        }

    </style>





    <script type = "module">
    const $ = el => document.querySelector(el)
    const $$ = el => document.querySelectorAll(el)

    const COLUMNAS = 10
    const FILAS = 15

    const range = length => Array.from({length } , (_, i) => i)

    const renderSpreadSheet = () => {
        const $table = $('table')
        const $head = $('thead')
        const $body = $('tbody')

        const headerHTML = `<tr>
                <th></th>
                ${range(COLUMNAS).map(i => `<th>${i}</th>`).join('')}
            </tr>`

        $head.innerHTML = headerHTML    

        const bodyHTML = range (FILAS).map(fila =>{
            return `<tr>
            <td>${fila + 1 }</td>
            ${range(COLUMNAS).map(columna => `
            <td data-x="${columna}" data-y="${fila}">
                <span></span>
                <input type= "text" value=""/>
            </td>    
            `).join('')}
   
        </tr>`
        }).join('')


        $body.innerHTML = bodyHTML
    }

    renderSpreadSheet()
    </script>


</head>

<body>

    <h1>Hoja de Cálculo</h1>

    <table>
        <thead></thead>

        <tbody></tbody>
    </table>
    
</body>
</html>
